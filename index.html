<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Vote OSIM MTsN 3 Banyuwangi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #f0fdf4; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 9999; }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    /* Animasi Paku Diperbesar */
    @keyframes pakuCoblos { 
      0% { transform: translateY(-200px) rotate(20deg) scale(1.5); opacity: 0; } 
      20% { opacity: 1; } 
      50% { transform: translateY(15px) rotate(0deg) scale(1); } 
      70% { transform: translateY(0px) rotate(0deg) scale(1); } 
      100% { transform: translateY(-100px) rotate(0deg) scale(0.8); opacity: 0; } 
    }
    .animate-paku { animation: pakuCoblos 0.8s ease-in-out forwards; }
    
    /* Animasi Lubang Sobek (Diubah jadi putih) */
    @keyframes lubangCoblos { 
      0% { opacity: 0; transform: scale(0) rotate(-20deg); } 
      49% { opacity: 0; transform: scale(0) rotate(-20deg); } 
      50% { opacity: 1; transform: scale(1.4) rotate(10deg); } 
      100% { opacity: 1; transform: scale(1) rotate(0deg); } 
    }
    .animate-lubang { animation: lubangCoblos 0.8s ease-in-out forwards; }

    /* Konfigurasi Cetak (Print) */
    @media print {
      body * { visibility: hidden !important; }
      #area-cetak, #area-cetak * { visibility: visible !important; color: black !important; }
      #area-cetak { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; background: white; }
      .no-print { display: none !important; }
      .modal-overlay { background: white !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================================
    // 🔴 [PENTING] PASTE URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    // ==========================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzfetSLPLc3BSjTInK4dce1P1rWXeRsPUhOmyKRj_829HRjSXKk2fU2Ou4RCMK0pCXr/exec"; 
    
    const LOGO_URL = "https://kegiatan-m3b.github.io/evote-osim/LOGOM3B.png";

    async function fetchAPI(action, payload = {}) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, payload })
        });
        const json = await response.json();
        if (json.status === 'error') throw new Error(json.message);
        return json.data;
      } catch (err) {
        console.error("Fetch Error:", err);
        throw err;
      }
    }

    function Modal({ isOpen, onClose, title, children, maxWidth = "max-w-lg" }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 flex items-center justify-center modal-overlay p-4 fade-in">
          <div className={`bg-white rounded-2xl shadow-2xl ${maxWidth} w-full overflow-hidden flex flex-col max-h-[95vh]`}>
            <div className="bg-emerald-700 text-white p-4 flex justify-between items-center no-print">
              <h3 className="font-bold text-lg">{title}</h3>
              {onClose && <button onClick={onClose} className="text-white hover:text-red-300 font-bold text-xl cursor-pointer">×</button>}
            </div>
            <div className="p-6 overflow-y-auto bg-white">{children}</div>
          </div>
        </div>
      );
    }

    function App() {
      const [view, setView] = useState('home'); 
      const [data, setData] = useState({ guru: [], siswa: [], kelas: [], kandidat: [] });
      const [loading, setLoading] = useState(true);

      useEffect(() => { if(view === 'home') loadInitialData(); }, [view]);

      const loadInitialData = () => {
        setLoading(true);
        fetchAPI('getInitialData').then(res => { setData(res); setLoading(false); }).catch(() => setLoading(false));
      };

      return (
        <div className="min-h-screen text-gray-800 flex flex-col">
          <header className="bg-emerald-700 text-white p-4 shadow-lg sticky top-0 z-50 no-print">
            <div className="container mx-auto flex justify-between items-center max-w-7xl">
              <div className="flex items-center space-x-3">
                <img src={LOGO_URL} alt="Logo" className="w-12 h-12 bg-white rounded-full p-0.5 object-cover" onError={(e)=>{e.target.style.display='none'}} />
                <div>
                  <h1 className="text-xl md:text-2xl font-bold tracking-tight leading-tight">E-Vote OSIM</h1>
                  <p className="text-xs md:text-sm text-emerald-100">MTsN 3 Banyuwangi</p>
                </div>
              </div>
              {view === 'home' ? (
                <button onClick={() => setView('login')} className="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm font-bold transition shadow">Login Admin</button>
              ) : (
                <button onClick={() => setView('home')} className="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-bold transition shadow">Keluar Aplikasi</button>
              )}
            </div>
          </header>

          <main className={`flex-1 ${view === 'admin' ? '' : 'container mx-auto p-4 max-w-7xl mt-4'} fade-in`}>
            {loading && view === 'home' && (
              <div className="text-center mt-20">
                <svg className="animate-spin h-10 w-10 text-emerald-600 mx-auto mb-4" viewBox="0 0 24 24" fill="none"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                <div className="text-emerald-600 font-bold text-xl">Menghubungkan ke Database...</div>
              </div>
            )}
            {!loading && view === 'home' && <VotingFlow data={data} setData={setData} />}
            {view === 'login' && <LoginScreen setView={setView} />}
            {view === 'admin' && <AdminDashboard />}
            {view === 'petugas' && <PetugasDashboard />}
          </main>
        </div>
      );
    }

    function VotingFlow({ data, setData }) {
      const [step, setStep] = useState(1);
      const [kategori, setKategori] = useState('');
      const [pilihanKelas, setPilihanKelas] = useState('');
      const [namaPemilih, setNamaPemilih] = useState('');
      const [kandidatPilihan, setKandidatPilihan] = useState(null);
      const [alertInfo, setAlertInfo] = useState({ show: false, msg: '' });
      const [coblosAnim, setCoblosAnim] = useState(null); 

      const filterNama = kategori === 'Guru' ? data.guru : data.siswa.filter(s => s.kelas === pilihanKelas);

      const handleSubmit = () => {
        // [FITUR PERCEPATAN / OPTIMISTIC UI UPDATE]
        // 1. Langsung tampilkan pesan sukses (Delay 0 Detik untuk Siswa)
        setAlertInfo({ show: true, msg: "Terimakasih sudah meluangkan waktu, suara anda sangat berarti" });

        // 2. Langsung ubah kotak nama menjadi merah (Sudah memilih) di memori aplikasi
        let kategoriKey = kategori.toLowerCase();
        let pemilihIndex = data[kategoriKey].findIndex(p => p.nama === namaPemilih);
        if(pemilihIndex > -1) {
          data[kategoriKey][pemilihIndex].status = 'Sudah';
          setData({...data}); 
        }

        // 3. Kirim data ke background secara diam-diam (LockService Server menangani tabrakannya)
        fetchAPI('submitVote', { kategori, namaPemilih, idKandidat: kandidatPilihan })
          .catch((err) => console.log("Gagal sync background:", err));
      };

      const handleTutupPesan = () => {
        setAlertInfo({show: false, msg: ''}); 
        setStep(1); setKategori(''); setPilihanKelas(''); setNamaPemilih(''); setKandidatPilihan(null);
      };

      const handleCoblos = (id) => {
        if(coblosAnim) return; setCoblosAnim(id);
        setTimeout(() => { setKandidatPilihan(id); setCoblosAnim(null); }, 800);
      };

      return (
        <div className="glass-card rounded-3xl shadow-2xl p-6 md:p-8 max-w-6xl mx-auto border-t-8 border-emerald-600">
          <Modal isOpen={alertInfo.show} title="Pemilihan Berhasil!">
            <div className="text-center py-4">
              <div className="text-6xl mb-6">🎉</div>
              <p className="text-2xl font-black text-emerald-700 leading-tight">{alertInfo.msg}</p>
              <button onClick={handleTutupPesan} className="mt-8 bg-emerald-600 text-white px-8 py-3 text-lg font-bold rounded-2xl cursor-pointer hover:bg-emerald-700 shadow-lg transition-all active:scale-95">
                Selesai & Kembali
              </button>
            </div>
          </Modal>

          {step === 1 && (
            <div className="text-center fade-in py-10">
              <h2 className="text-3xl md:text-4xl font-black mb-12 text-emerald-800">Masuk Sebagai Pemilih?</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto">
                <button onClick={() => { setKategori('Guru'); setStep(2); }} className="p-14 bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 rounded-3xl cursor-pointer shadow-md transform transition hover:-translate-y-2">
                  <span className="text-6xl block mb-4">👨‍🏫</span>
                  <span className="font-black text-2xl text-blue-900">Guru / Pegawai</span>
                </button>
                <button onClick={() => { setKategori('Siswa'); setStep(2); }} className="p-14 bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-200 rounded-3xl cursor-pointer shadow-md transform transition hover:-translate-y-2">
                  <span className="text-6xl block mb-4">👨‍🎓</span>
                  <span className="font-black text-2xl text-emerald-900">Siswa MTsN 3</span>
                </button>
              </div>
            </div>
          )}
          
          {step === 2 && (
            <div className="fade-in max-w-5xl mx-auto">
              <h2 className="text-3xl font-black mb-8 text-center text-gray-800 border-b-2 pb-4">Identitas {kategori}</h2>
              
              {kategori === 'Siswa' && (
                <div className="mb-10 max-w-md mx-auto">
                  <label className="block text-sm font-bold mb-3 text-gray-600 text-center uppercase tracking-widest">Pilih Kelas</label>
                  <select className="w-full p-4 border-2 rounded-2xl bg-white text-xl font-bold outline-none focus:border-emerald-500 focus:ring-4 ring-emerald-100 text-center shadow-sm" 
                    value={pilihanKelas} onChange={(e) => {setPilihanKelas(e.target.value); setNamaPemilih('');}}>
                    <option value="">-- PILIH KELAS ANDA --</option>
                    {data.kelas.map(k => <option key={k} value={k}>{k}</option>)}
                  </select>
                </div>
              )}
              
              {(kategori === 'Guru' || (kategori === 'Siswa' && pilihanKelas)) && (
                <div className="mb-10 fade-in">
                  <label className="block text-sm font-bold mb-6 text-gray-600 text-center uppercase tracking-widest">Ketuk Kotak Nama Anda</label>
                  
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    {filterNama.map(p => {
                      const isSudah = p.status === 'Sudah';
                      const isSelected = namaPemilih === p.nama;
                      return (
                        <button 
                          key={p.id}
                          disabled={isSudah}
                          onClick={() => setNamaPemilih(p.nama)}
                          className={`relative p-4 rounded-xl border-2 font-bold transition-all text-sm md:text-base flex flex-col items-center justify-center min-h-[90px] shadow-sm
                            ${isSudah 
                              ? 'border-red-300 bg-red-50 text-red-500 cursor-not-allowed opacity-75' 
                              : isSelected 
                                ? 'border-emerald-600 bg-emerald-600 text-white shadow-lg transform scale-105 ring-4 ring-emerald-200' 
                                : 'border-emerald-500 bg-white text-emerald-800 hover:bg-emerald-50 hover:shadow-md cursor-pointer'}`}
                        >
                          <span className="text-center leading-tight">{p.nama}</span>
                          {isSudah && <span className="absolute bottom-2 text-[10px] bg-red-200 text-red-800 px-2 py-0.5 rounded-full uppercase tracking-wider">Telah Memilih</span>}
                        </button>
                      );
                    })}
                    {filterNama.length === 0 && <div className="col-span-full text-center p-10 text-gray-500 font-bold bg-gray-50 rounded-xl border-2 border-dashed">Belum ada data.</div>}
                  </div>
                </div>
              )}
              
              <div className="flex justify-center gap-6 mt-12 max-w-lg mx-auto">
                <button onClick={() => {setStep(1); setNamaPemilih(''); setPilihanKelas('');}} className="w-1/3 py-4 bg-gray-200 rounded-2xl cursor-pointer font-bold text-gray-700 hover:bg-gray-300 transition-colors">Batal</button>
                <button onClick={() => setStep(3)} disabled={!namaPemilih} className="w-2/3 py-4 bg-emerald-600 rounded-2xl text-white font-bold disabled:opacity-50 cursor-pointer shadow-lg hover:bg-emerald-700 transition-transform active:scale-95">Buka Surat Suara ➔</button>
              </div>
            </div>
          )}
          
          {step === 3 && (
            <div className="fade-in">
              <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl mb-8 text-center max-w-2xl mx-auto">
                <h2 className="text-3xl font-black text-emerald-800">Surat Suara Digital</h2>
                <p className="text-emerald-600 font-medium mt-1">Sentuh area foto / kotak kandidat untuk Mencoblos.</p>
              </div>
              
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12">
                {data.kandidat.map(k => (
                  <div key={k.id} onClick={() => handleCoblos(k.id)} 
                    className={`relative cursor-pointer rounded-3xl overflow-hidden border-[6px] transition-all duration-300 transform 
                    ${kandidatPilihan === k.id ? 'border-emerald-600 ring-[10px] ring-emerald-200 shadow-2xl scale-[1.02]' : 'border-gray-200 shadow-xl bg-white hover:border-emerald-400'}`}>
                    
                    {coblosAnim === k.id && (
                      <div className="absolute inset-0 flex items-center justify-center z-50 pointer-events-none">
                        <svg className="w-56 h-56 md:w-72 md:h-72 text-gray-800 drop-shadow-[0_30px_30px_rgba(0,0,0,0.8)] animate-paku absolute" fill="currentColor" viewBox="0 0 24 24"><path d="M11 2h2v16l-1 4-1-4V2zm-3 2h8a1 1 0 010 2H8a1 1 0 010-2z" /></svg>
                        
                        {/* EFEK LUBANG PUTIH SOBEK */}
                        <svg className="w-24 h-24 md:w-32 md:h-32 absolute animate-lubang drop-shadow-2xl" viewBox="0 0 100 100">
                           <path d="M45,5 L60,15 L85,10 L75,35 L95,55 L75,70 L85,90 L55,80 L40,95 L20,80 L5,90 L15,65 L0,45 L20,30 L10,10 L35,20 Z" fill="#e5e7eb"/>
                           <circle cx="50" cy="50" r="34" fill="#ffffff"/>
                        </svg>
                      </div>
                    )}
                    {kandidatPilihan === k.id && coblosAnim === null && (
                      <div className="absolute inset-0 flex items-center justify-center z-40 pointer-events-none">
                        <svg className="w-24 h-24 md:w-32 md:h-32 absolute drop-shadow-2xl opacity-95" viewBox="0 0 100 100">
                           <path d="M45,5 L60,15 L85,10 L75,35 L95,55 L75,70 L85,90 L55,80 L40,95 L20,80 L5,90 L15,65 L0,45 L20,30 L10,10 L35,20 Z" fill="#e5e7eb"/>
                           <circle cx="50" cy="50" r="34" fill="#ffffff"/>
                        </svg>
                      </div>
                    )}

                    <div className="h-96 md:h-[32rem] bg-gray-100 relative">
                      {k.foto ? <img src={k.foto} className="w-full h-full object-cover" onError={(e)=>{e.target.src="https://via.placeholder.com/400x500?text=Foto+Gagal+Dimuat"}} /> : <div className="flex h-full items-center justify-center text-gray-400 font-medium">Foto Tidak Ditemukan</div>}
                      <div className="absolute top-4 right-4 bg-emerald-600 text-white font-black w-16 h-16 rounded-full flex items-center justify-center text-4xl border-4 border-white shadow-xl">{k.no}</div>
                    </div>
                    
                    <div className="p-8 text-center bg-white relative z-10">
                      <h3 className="font-black text-3xl text-emerald-900 leading-tight">{k.ketua}</h3><p className="text-gray-500 font-bold tracking-widest text-sm mt-1 uppercase">Calon Ketua</p>
                      <div className="my-5 flex items-center justify-center"><div className="border-t-2 border-dashed border-gray-300 w-1/4"></div><span className="mx-4 text-emerald-600 font-bold">&</span><div className="border-t-2 border-dashed border-gray-300 w-1/4"></div></div>
                      <h3 className="font-black text-3xl text-emerald-900 leading-tight">{k.wakil}</h3><p className="text-gray-500 font-bold tracking-widest text-sm mt-1 uppercase">Calon Wakil</p>
                    </div>
                  </div>
                ))}
              </div>

              <div className="mt-12 flex flex-col sm:flex-row justify-between items-center sm:items-end bg-gray-50 p-6 rounded-2xl border-2 border-gray-200 gap-6">
                <button onClick={() => setStep(2)} className="w-full sm:w-auto px-8 py-4 bg-gray-300 hover:bg-gray-400 rounded-2xl cursor-pointer font-bold text-gray-700 text-lg">Ganti Identitas</button>
                <div className="flex flex-col w-full sm:w-auto items-center sm:items-end">
                  <span className="text-emerald-800 font-black text-lg mb-2">👤 Pemilih: <span className="text-blue-700">{namaPemilih}</span></span>
                  <button onClick={handleSubmit} disabled={!kandidatPilihan || coblosAnim !== null} 
                    className="w-full px-10 py-5 bg-emerald-600 hover:bg-emerald-700 rounded-2xl text-white font-black text-2xl disabled:opacity-50 cursor-pointer shadow-xl transform transition active:scale-95 flex items-center justify-center">
                    {kandidatPilihan ? 'KIRIM KE KOTAK SUARA 🗳️' : 'BELUM ADA PILIHAN'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function LoginScreen({ setView }) {
      const [role, setRole] = useState('Admin');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLogin = (e) => {
        e.preventDefault(); setLoading(true); setError('');
        fetchAPI('authenticateUser', { role, password }).then(res => {
          setLoading(false);
          if (res.success) setView(res.role === 'Admin' ? 'admin' : 'petugas'); else setError(res.message);
        }).catch(() => setLoading(false));
      };

      return (
        <div className="max-w-md mx-auto glass-card rounded-3xl shadow-2xl p-10 mt-10 border-t-8 border-emerald-600">
          <h2 className="text-3xl font-black text-center text-emerald-800 mb-8">Akses Terbatas</h2>
          {error && <div className="bg-red-100 text-red-700 p-4 rounded-xl mb-6 text-center font-bold">{error}</div>}
          <form onSubmit={handleLogin}>
            <div className="mb-6">
              <label className="block text-sm font-bold mb-2 text-gray-700">Masuk Sebagai</label>
              <select className="w-full p-4 border-2 rounded-xl bg-white font-medium outline-none" value={role} onChange={(e) => setRole(e.target.value)}>
                <option value="Admin">Admin Pusat</option>
                <option value="Petugas">Petugas KPPS</option>
              </select>
            </div>
            <div className="mb-8">
              <label className="block text-sm font-bold mb-2 text-gray-700">Kata Sandi</label>
              <input type="password" placeholder="••••••••" className="w-full p-4 border-2 rounded-xl font-medium outline-none" value={password} onChange={(e) => setPassword(e.target.value)} required />
            </div>
            <button type="submit" disabled={loading} className="w-full bg-emerald-600 text-white font-black py-4 rounded-xl hover:bg-emerald-700 cursor-pointer text-xl shadow-lg">{loading ? 'Memeriksa...' : 'MASUK'}</button>
          </form>
        </div>
      );
    }

    // --- DASHBOARD ADMIN ---
    function AdminDashboard() {
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [activeMenu, setActiveMenu] = useState('Siswa');
      const [tableData, setTableData] = useState([]);
      const [loading, setLoading] = useState(false);
      const [modalForm, setModalForm] = useState({ show: false, action: '', rowNum: null, rowData: {} });
      const [imageModal, setImageModal] = useState('');
      const [filterKelas, setFilterKelas] = useState('Semua');
      const [selectedRows, setSelectedRows] = useState([]); 

      const formSchema = { 'Siswa': ['ID_Siswa', 'Nama_Siswa', 'Kelas', 'Status_Vote'], 'Guru': ['ID_Guru', 'Nama_Guru', 'Status_Vote'], 'Kandidat': ['ID_Kandidat', 'No_Urut', 'Nama_Ketua', 'Nama_Wakil', 'Foto_URL'] };

      const loadData = (menu) => {
        setLoading(true); setTableData([]); setSelectedRows([]);
        fetchAPI('adminGetData', { sheetName: menu }).then(res => { setTableData(res); setLoading(false); }).catch(()=>setLoading(false));
      };

      useEffect(() => { loadData(activeMenu); setFilterKelas('Semua'); }, [activeMenu]);

      const handleSave = (e) => {
        e.preventDefault(); setLoading(true); setModalForm({ ...modalForm, show: false });
        const rowArray = formSchema[activeMenu].map(field => modalForm.rowData[field] || '');
        fetchAPI('adminCrud', { sheetName: activeMenu, action: modalForm.action, rowNum: modalForm.rowNum, rowData: rowArray }).then(() => loadData(activeMenu));
      };

      const handleHapusMassal = () => {
        if(selectedRows.length === 0) return alert("Centang minimal 1 data di tabel!");
        if(confirm(`YAKIN HAPUS ${selectedRows.length} DATA?`)) {
          setLoading(true);
          fetchAPI('adminDeleteMultiple', { sheetName: activeMenu, rowNums: selectedRows }).then(res => { alert(res.message); loadData(activeMenu); });
        }
      };

      const daftarKelasAdmin = activeMenu === 'Siswa' ? [...new Set(tableData.map(r => r.Kelas))].filter(Boolean).sort() : [];
      const filteredData = tableData.filter(row => activeMenu !== 'Siswa' || filterKelas === 'Semua' || row.Kelas === filterKelas);

      return (
        <div className="flex bg-white h-[calc(100vh-80px)] -mx-4 -mt-4 overflow-hidden border-t border-gray-200">
          <Modal isOpen={!!imageModal} onClose={() => setImageModal('')} title="Pratinjau Foto"><img src={imageModal} className="w-full h-auto rounded-lg" /></Modal>
          <Modal isOpen={modalForm.show} onClose={() => setModalForm({show:false, rowData:{}})} title={modalForm.action === 'add' ? 'Tambah Data' : 'Edit Data'}>
            <form onSubmit={handleSave} className="space-y-4">
              {formSchema[activeMenu].map(field => (
                <div key={field}>
                  <label className="block text-sm font-bold mb-1">{field.replace('_', ' ')}</label>
                  {field === 'Foto_URL' ? (
                    <div className="space-y-1">
                      <input type="text" className="w-full p-3 border rounded bg-gray-50" value={modalForm.rowData[field] || ''} onChange={(e) => setModalForm(prev => ({ ...prev, rowData: { ...prev.rowData, [field]: e.target.value } }))} placeholder="Paste link foto..." />
                      <p className="text-[11px] text-gray-500">*Paste URL gambar dari repository GitHub Anda.</p>
                    </div>
                  ) : (<input type="text" className="w-full p-3 border rounded" value={modalForm.rowData[field] || ''} onChange={(e) => setModalForm(prev => ({ ...prev, rowData: { ...prev.rowData, [field]: e.target.value } }))} required />)}
                </div>
              ))}
              <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-3 rounded mt-4">Simpan Perubahan</button>
            </form>
          </Modal>

          <div className={`bg-gray-800 text-white transition-all flex flex-col ${sidebarOpen ? 'w-64' : 'w-0'}`}>
            <div className="p-4 font-bold border-b border-gray-700 whitespace-nowrap text-lg">📁 Database</div>
            <ul className="flex-1 overflow-y-auto">
              {['Siswa', 'Guru', 'Kandidat'].map(m => (
                <li key={m}><button onClick={() => setActiveMenu(m)} className={`w-full text-left px-5 py-4 hover:bg-gray-700 border-b border-gray-700 ${activeMenu === m ? 'bg-emerald-600 font-bold' : ''}`}>{m === 'Kandidat' ? '🎖️' : '👥'} Data {m}</button></li>
              ))}
            </ul>
          </div>

          <div className="flex-1 flex flex-col bg-gray-50 overflow-hidden relative">
            <button onClick={() => setSidebarOpen(!sidebarOpen)} className="absolute top-1/2 -mt-10 left-0 z-20 bg-emerald-700 hover:bg-emerald-800 text-white w-10 h-20 rounded-r-2xl shadow-2xl flex items-center justify-center text-2xl font-black transition-all border-y-2 border-r-2 border-emerald-400">{sidebarOpen ? '❮' : '❯'}</button>
            
            <div className="p-6 pl-16 flex-1 overflow-y-auto">
              <div className="flex flex-col md:flex-row justify-between mb-6 gap-4 border-b pb-4">
                <div><h2 className="text-2xl font-black">Tabel {activeMenu}</h2><p className="text-sm font-bold text-gray-500">Jumlah: {filteredData.length}</p></div>
                <div className="flex gap-2">
                  {activeMenu === 'Siswa' && (<select className="border-2 p-2 rounded-lg font-bold" value={filterKelas} onChange={e => {setFilterKelas(e.target.value); setSelectedRows([]);}}><option value="Semua">Semua Kelas</option>{daftarKelasAdmin.map(k => <option key={k} value={k}>Kelas {k}</option>)}</select>)}
                  <button onClick={() => setModalForm({ show: true, action: 'add', rowNum: null, rowData: {} })} className="bg-emerald-600 text-white px-5 py-2.5 rounded-lg font-bold">+ Tambah</button>
                  {(activeMenu === 'Siswa' || activeMenu === 'Guru') && (<button onClick={handleHapusMassal} disabled={selectedRows.length === 0} className={`px-5 py-2.5 rounded-lg font-bold ${selectedRows.length > 0 ? 'bg-red-600 text-white' : 'bg-gray-300'}`}>🗑️ Hapus ({selectedRows.length})</button>)}
                </div>
              </div>

              {loading ? <div className="text-center p-10 font-bold text-emerald-600 animate-pulse text-xl">Sinkronisasi Data...</div> : (
                <div className="bg-white rounded-xl shadow overflow-x-auto border">
                  <table className="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                      <tr className="bg-gray-800 text-white">
                        {(activeMenu === 'Siswa' || activeMenu === 'Guru') && (<th className="p-4 w-10 text-center"><input type="checkbox" className="w-4 h-4 cursor-pointer" onChange={(e) => setSelectedRows(e.target.checked ? filteredData.map(r => r._rowNum) : [])} checked={filteredData.length > 0 && selectedRows.length === filteredData.length} /></th>)}
                        <th className="p-4">Tindakan</th>{formSchema[activeMenu].map(h => <th key={h} className="p-4 font-semibold">{h.replace('_',' ')}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {filteredData.map((row, i) => (
                        <tr key={i} className={`border-b hover:bg-emerald-50 ${selectedRows.includes(row._rowNum) ? 'bg-blue-50' : ''}`}>
                          {(activeMenu === 'Siswa' || activeMenu === 'Guru') && (<td className="p-4 text-center"><input type="checkbox" className="w-4 h-4 cursor-pointer" checked={selectedRows.includes(row._rowNum)} onChange={() => setSelectedRows(selectedRows.includes(row._rowNum) ? selectedRows.filter(r => r !== row._rowNum) : [...selectedRows, row._rowNum])} /></td>)}
                          <td className="p-4"><button onClick={() => setModalForm({ show: true, action: 'edit', rowNum: row._rowNum, rowData: row })} className="bg-blue-100 text-blue-700 px-4 py-2 rounded font-bold text-xs">EDIT</button></td>
                          {formSchema[activeMenu].map(h => (<td key={h} className="p-4 text-sm font-medium">{h === 'Foto_URL' && row[h] ? <button onClick={() => setImageModal(row[h])} className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded font-bold text-xs">🖼️ FOTO</button> : row[h]}</td>))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- DASHBOARD PETUGAS ---
    function PetugasDashboard() {
      const [stats, setStats] = useState(null);
      const [activeTab, setActiveTab] = useState('Statistik');
      const [filterKategori, setFilterKategori] = useState('Semua');
      const [filterStatus, setFilterStatus] = useState('Semua');

      const [formBA, setFormBA] = useState({ tanggal: '24 Agustus 2026', namaPembina: '', nipPembina: '', namaKepala: '', nipKepala: '' });
      const [showPreviewBA, setShowPreviewBA] = useState(false);

      useEffect(() => { fetchAPI('getPetugasStats').then(res => setStats(res)); }, []);
      if(!stats) return <div className="text-center text-emerald-600 p-10 font-bold animate-pulse text-xl">Memuat Rekapitulasi Suara...</div>;

      const filteredPemilih = stats.listPemilih.filter(p => (filterKategori === 'Semua' || p.kelas === filterKategori) && (filterStatus === 'Semua' || p.status === filterStatus));
      let kandidatUrut = [...stats.hasilKandidat].sort((a,b) => b.total - a.total);
      let pemenang = kandidatUrut.length > 0 ? kandidatUrut[0] : null;

      const handleCetakPDF = () => window.print();
      const handleUnduhWord = () => {
        const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Berita Acara</title></head><body>";
        const html = header + document.getElementById('area-cetak').innerHTML + "</body></html>";
        const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'Berita_Acara_Pemilihan_OSIM.doc';
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      return (
        <div className="space-y-6 fade-in pb-10">
          <div className="flex gap-4 justify-center mb-8 no-print">
            <button onClick={() => setActiveTab('Statistik')} className={`px-8 py-3 rounded-xl font-bold transition-all shadow-md ${activeTab === 'Statistik' ? 'bg-emerald-700 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}`}>📊 Statistik Suara</button>
            <button onClick={() => setActiveTab('BeritaAcara')} className={`px-8 py-3 rounded-xl font-bold transition-all shadow-md ${activeTab === 'BeritaAcara' ? 'bg-emerald-700 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}`}>📝 Cetak Berita Acara</button>
          </div>

          {activeTab === 'Statistik' && (
            <div className="space-y-8 fade-in">
              <h2 className="text-3xl font-black text-emerald-800 text-center">Rekapitulasi KPPS</h2>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="glass-card p-6 rounded-2xl shadow-lg border-b-8 border-blue-500 text-center bg-white"><p className="text-gray-500 font-bold mb-1">Total DPT</p><h3 className="text-5xl font-black text-blue-700">{stats.totalPemilih}</h3></div>
                <div className="glass-card p-6 rounded-2xl shadow-lg border-b-8 border-emerald-500 text-center bg-white"><p className="text-gray-500 font-bold mb-1">Suara Masuk</p><h3 className="text-5xl font-black text-emerald-700">{stats.sudahVote}</h3></div>
                <div className="glass-card p-6 rounded-2xl shadow-lg border-b-8 border-orange-500 text-center bg-white"><p className="text-gray-500 font-bold mb-1">Partisipasi</p><h3 className="text-5xl font-black text-orange-600">{stats.persentase}%</h3></div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className="glass-card p-6 rounded-2xl shadow bg-white">
                  <h3 className="font-bold text-xl mb-4 border-b pb-2">Partisipasi Kelas</h3>
                  <div className="space-y-4 max-h-80 overflow-y-auto pr-2">
                    {Object.keys(stats.partisipasi).sort().map(kls => {
                      let d = stats.partisipasi[kls]; let pct = d.total ? ((d.sudah/d.total)*100).toFixed(0) : 0;
                      return (<div key={kls}><div className="flex justify-between text-sm font-bold mb-1"><span>{kls}</span><span>{d.sudah}/{d.total}</span></div><div className="w-full bg-gray-200 rounded-full h-3"><div className="bg-emerald-500 h-3 rounded-full" style={{width: `${pct}%`}}></div></div></div>);
                    })}
                  </div>
                </div>

                <div className="glass-card p-6 rounded-2xl shadow bg-white">
                  <h3 className="font-bold text-xl mb-4 border-b pb-2">Perolehan Suara Kandidat</h3>
                  <div className="space-y-6 max-h-80 overflow-y-auto pr-2">
                    {stats.hasilKandidat.map(k => {
                      let pct = stats.sudahVote > 0 ? ((k.total / stats.sudahVote) * 100).toFixed(1) : 0;
                      return (
                        <div key={k.id} className="bg-blue-50 p-5 rounded-2xl border border-blue-200">
                          <div className="flex justify-between text-xl font-black mb-2 text-blue-900"><span>{k.nama}</span><span>{k.total} Suara</span></div>
                          <div className="w-full bg-gray-300 rounded-full h-4 mb-3"><div className="bg-blue-600 h-4 rounded-full" style={{ width: `${pct}%` }}></div></div>
                          <div className="flex flex-wrap gap-2">{Object.keys(k.perKelas).sort().map(kls => (<span key={kls} className="text-xs bg-white border border-blue-200 px-2 py-1 rounded-md font-medium">{kls}: <b className="text-blue-700">{k.perKelas[kls]}</b></span>))}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="glass-card p-6 rounded-2xl shadow bg-white mt-6">
                <div className="flex flex-col md:flex-row justify-between items-center mb-6 border-b pb-4 gap-4">
                  <h3 className="font-bold text-xl text-gray-800">Daftar Pemilih</h3>
                  <div className="flex gap-2">
                    <select className="border-2 p-2 rounded-lg font-bold text-sm" value={filterKategori} onChange={e => setFilterKategori(e.target.value)}><option value="Semua">Semua Kelas</option>{stats.daftarKelas.map(k => <option key={k} value={k}>{k}</option>)}</select>
                    <select className="border-2 p-2 rounded-lg font-bold text-sm" value={filterStatus} onChange={e => setFilterStatus(e.target.value)}><option value="Semua">Semua Status</option><option value="Sudah">Sudah Coblos</option><option value="Belum">Belum Coblos</option></select>
                  </div>
                </div>
                <div className="max-h-96 overflow-y-auto border-2 rounded-xl">
                  <table className="w-full text-left border-collapse text-sm">
                    <thead className="sticky top-0 bg-gray-800 text-white z-10"><tr><th className="p-4 border-b">Nama Pemilih</th><th className="p-4 border-b">Kelas</th><th className="p-4 border-b text-center">Status</th></tr></thead>
                    <tbody>
                      {filteredPemilih.map((p, i) => (
                        <tr key={i} className="border-b hover:bg-gray-50 font-medium">
                          <td className="p-4">{p.nama}</td><td className="p-4">{p.kelas}</td>
                          <td className="p-4 text-center"><span className={`px-3 py-1.5 rounded-lg text-xs font-black ${p.status === 'Sudah' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>{p.status === 'Sudah' ? '✔ SUDAH' : '❌ BELUM'}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab === 'BeritaAcara' && (
            <div className="glass-card p-8 rounded-3xl shadow-xl max-w-3xl mx-auto bg-white fade-in">
              <h2 className="text-2xl font-black text-gray-800 mb-6 border-b pb-4">Input Data Berita Acara</h2>
              <div className="space-y-5">
                <div><label className="block text-sm font-bold mb-2">Tanggal Berita Acara</label><input type="text" className="w-full p-3 border-2 rounded-xl" value={formBA.tanggal} onChange={(e) => setFormBA({...formBA, tanggal: e.target.value})} /></div>
                <div className="grid grid-cols-2 gap-4">
                  <div><label className="block text-sm font-bold mb-2">Nama Pembina OSIM</label><input type="text" className="w-full p-3 border-2 rounded-xl" value={formBA.namaPembina} onChange={(e) => setFormBA({...formBA, namaPembina: e.target.value})} placeholder="Cth: Budi Santoso, S.Pd"/></div>
                  <div><label className="block text-sm font-bold mb-2">NIP Pembina OSIM</label><input type="text" className="w-full p-3 border-2 rounded-xl" value={formBA.nipPembina} onChange={(e) => setFormBA({...formBA, nipPembina: e.target.value})} placeholder="Isi NIP atau strip (-)"/></div>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div><label className="block text-sm font-bold mb-2">Nama Kepala Madrasah</label><input type="text" className="w-full p-3 border-2 rounded-xl" value={formBA.namaKepala} onChange={(e) => setFormBA({...formBA, namaKepala: e.target.value})} placeholder="Cth: Drs. H. Fulan, M.Pd.I"/></div>
                  <div><label className="block text-sm font-bold mb-2">NIP Kepala Madrasah</label><input type="text" className="w-full p-3 border-2 rounded-xl" value={formBA.nipKepala} onChange={(e) => setFormBA({...formBA, nipKepala: e.target.value})} placeholder="Isi NIP atau strip (-)"/></div>
                </div>
                <button onClick={() => setShowPreviewBA(true)} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl mt-6 text-lg cursor-pointer shadow-md">Pratinjau (Preview) Surat</button>
              </div>

              <Modal isOpen={showPreviewBA} onClose={() => setShowPreviewBA(false)} title="Preview Berita Acara" maxWidth="max-w-4xl">
                <div id="area-cetak" style={{ fontFamily: 'Times New Roman, serif', color: 'black', padding: '20px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', marginBottom: '10px' }}>
                    <div style={{ width: '100px' }}><img src={LOGO_URL} alt="Logo" style={{ width: '90px', height: '90px' }} /></div>
                    <div style={{ flex: 1, textAlign: 'center' }}>
                      <h2 style={{ margin: 0, fontSize: '24px', fontWeight: 'bold' }}>KEMENTERIAN AGAMA REPUBLIK INDONESIA</h2>
                      <h2 style={{ margin: 0, fontSize: '20px', fontWeight: 'bold' }}>MADRASAH TSANAWIYAH NEGERI 3 BANYUWANGI</h2>
                      <p style={{ margin: 0, fontSize: '14px' }}>Jalan Raya No. 171, Desa Kebaman, Kecamatan Srono, Kabupaten Banyuwangi.</p>
                    </div>
                  </div>
                  <div style={{ borderBottom: '4px solid black', marginBottom: '2px' }}></div><div style={{ borderBottom: '1px solid black', marginBottom: '20px' }}></div>
                  <h3 style={{ textAlign: 'center', fontWeight: 'bold', fontSize: '16px', textTransform: 'uppercase', marginBottom: '20px', lineHeight: '1.5' }}>BERITA ACARA PEMILIHAN CALON KETUA DAN WAKIL KETUA<br/>ORGANISASI SISWA INTRA MADRASAH (OSIM)<br/>MTsN 3 BANYUWANGI TAHUN KHIDMAT 2026/2027</h3>
                  <p style={{ textAlign: 'justify', lineHeight: '1.6', marginBottom: '15px' }}>Pada hari ini, telah dilaksanakan pemungutan dan penghitungan suara secara digital (E-Vote) dalam rangka Pemilihan Ketua dan Wakil Ketua Organisasi Siswa Intra Madrasah (OSIM) MTsN 3 Banyuwangi Tahun Khidmat 2026/2027.</p>
                  <p style={{ textAlign: 'justify', lineHeight: '1.6', marginBottom: '15px' }}>Adapun rincian data partisipasi pemilih adalah sebagai berikut: <br/>- Total Daftar Pemilih Tetap (DPT) : <b>{stats.totalPemilih}</b> Suara <br/>- Total Suara Masuk (Sah) : <b>{stats.sudahVote}</b> Suara <br/>- Total Tidak Memilih (Golput) : <b>{stats.totalPemilih - stats.sudahVote}</b> Suara</p>
                  <p style={{ textAlign: 'justify', lineHeight: '1.6', marginBottom: '10px' }}>Berdasarkan hasil penghitungan suara, diperoleh hasil perolehan suara masing-masing kandidat sebagai berikut:</p>
                  <table style={{ width: '100%', borderCollapse: 'collapse', marginBottom: '20px' }}>
                    <thead><tr><th style={{ border: '1px solid black', padding: '8px' }}>No. Urut</th><th style={{ border: '1px solid black', padding: '8px' }}>Nama Pasangan Calon</th><th style={{ border: '1px solid black', padding: '8px' }}>Perolehan Suara</th><th style={{ border: '1px solid black', padding: '8px' }}>Persentase</th></tr></thead>
                    <tbody>
                      {stats.hasilKandidat.map(k => {
                        let pct = stats.sudahVote > 0 ? ((k.total / stats.sudahVote) * 100).toFixed(2) : 0;
                        return(<tr key={k.id}><td style={{ border: '1px solid black', padding: '8px', textAlign: 'center' }}>{k.nama.split(" &")[0] ? "Calon" : "-"}</td><td style={{ border: '1px solid black', padding: '8px' }}>{k.nama}</td><td style={{ border: '1px solid black', padding: '8px', textAlign: 'center' }}>{k.total}</td><td style={{ border: '1px solid black', padding: '8px', textAlign: 'center' }}>{pct}%</td></tr>)
                      })}
                    </tbody>
                  </table>
                  <p style={{ textAlign: 'justify', lineHeight: '1.6', marginBottom: '30px' }}>Berdasarkan rekapitulasi di atas, maka pasangan atas nama <b>{pemenang ? pemenang.nama : '................'}</b> ditetapkan sebagai Ketua dan Wakil Ketua OSIM MTsN 3 Banyuwangi terpilih Masa Bakti 2026/2027. <br/>Demikian Berita Acara ini dibuat dengan sebenar-benarnya untuk dapat dipergunakan sebagaimana mestinya.</p>
                  <table style={{ width: '100%', border: 'none' }}>
                    <tbody>
                      <tr>
                        <td style={{ width: '50%', textAlign: 'center', verticalAlign: 'top' }}><br/><br/>Pembina OSIM,<br/><br/><br/><br/><b><u>{formBA.namaPembina || '(....................................)'}</u></b><br/>NIP. {formBA.nipPembina || '....................................'}</td>
                        <td style={{ width: '50%', textAlign: 'center', verticalAlign: 'top' }}>Banyuwangi, {formBA.tanggal}<br/>Mengetahui,<br/>Kepala MTsN 3 Banyuwangi,<br/><br/><br/><br/><b><u>{formBA.namaKepala || '(....................................)'}</u></b><br/>NIP. {formBA.nipKepala || '....................................'}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div className="flex justify-end gap-4 mt-8 pt-4 border-t no-print bg-gray-50 p-4 rounded-xl">
                  <button onClick={() => setShowPreviewBA(false)} className="px-6 py-2 bg-gray-300 rounded-lg font-bold text-gray-700 hover:bg-gray-400">Kembali</button>
                  <button onClick={handleUnduhWord} className="px-6 py-2 bg-blue-600 rounded-lg font-bold text-white hover:bg-blue-700 cursor-pointer">📄 Unduh Word</button>
                  <button onClick={handleCetakPDF} className="px-6 py-2 bg-emerald-600 rounded-lg font-bold text-white hover:bg-emerald-700 cursor-pointer">🖨️ Cetak PDF</button>
                </div>
              </Modal>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
